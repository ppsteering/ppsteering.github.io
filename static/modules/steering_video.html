<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PPS rollout vs. steering strength &amp; input noise</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono:wght@400;500&family=STIX+Two+Text:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
<style>
  body {
    --font-original: 'Inter',-apple-system,'system-ui','Helvetica Neue',Arial,sans-serif;
    --font-mono: 'Roboto Mono', ui-monospace, monospace;
    --font-math: 'STIX Two Text','Latin Modern Math','Cambria Math',Georgia,'Times New Roman',serif;
    --bg: #fdfaf4; --panel: #fffdf8; --ink: #131920; --sub: #6b6453;
    --line: #e4dcc8; --soft: #efece4; --resid: #e0863a;
    --shadow: 0 1px 2px rgba(40,32,16,0.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-original); font-weight: 300;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 26px 36px; }
  .m { font-family: var(--font-math); }
  .m i { font-style: italic; font-weight: 400; }
  .m sub { font-style: normal; font-weight: 400; }

  /* One filled block for the whole figure (same fill as the method figure's
     panels); the clips inside sit directly on it without their own cards. */
  .module { background: var(--soft); border: 0; border-radius: 12px;
    box-shadow: none; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
  /* Four rollouts shown in parallel (capsule + fruit + tea + egg), sharing the
     strength slider + input-noise buttons + legend. */
  /* Task tabs (matches the Baseline Comparison carousel tabs). */
  .task-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .task-tabs button { font: 600 14px/1.2 var(--font-original); color: var(--ink); background: var(--bg);
    border: 0; border-radius: 12px; padding: 10px 8px; cursor: pointer;
    text-align: center; transition: all .18s ease; }
  .task-tabs button .stage { display: block; font-weight: 400; font-size: 14px; margin-top: 3px; color: var(--sub); }
  .task-tabs button.on .stage { color: rgba(255,255,255,.8); }
  .task-tabs button:hover { box-shadow: 0 6px 14px rgba(40,32,16,0.10); transform: translateY(-1px); }
  .task-tabs button.on { background: var(--ink); color: #fff; }
  /* 2×2 grid = the 4 input-noise samples of the selected task. */
  /* One row of the four input-noise samples; falls back to 2x2 on narrow screens. */
  .vidrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 760px) { .vidrow { grid-template-columns: 1fr 1fr; gap: 12px; } }
  @media (max-width: 420px) { .vidrow { grid-template-columns: 1fr; } }

  /* Panels share one aspect (768/518); the taller 4:3 fruit clip is cover-fit. */
  /* Frame is 80% of the clip width; cover-fit anchored to the right edge crops
     the left 20% of every clip (the empty table area). */
  .vidwrap { position: relative; line-height: 0; background: transparent; border: 0;
    border-radius: 8px; padding: 0; box-shadow: none;
    overflow: hidden; aspect-ratio: 614 / 518; }
  /* Subtask label overlaid on the rollout, top-left. */
  .vidwrap .vidtask { position: absolute; top: 10px; left: 10px; z-index: 4;
    font: 400 14px/1 var(--font-original); color: #fff;
    background: rgba(27, 27, 27, 0.7); padding: 5px 9px; border-radius: 7px;
    letter-spacing: 0; pointer-events: none; }
  @media (max-width: 760px) { .vidwrap .vidtask { top: 14px; left: 14px; font-size: 14px; padding: 6px 12px; border-radius: 8px; } }
  /* Outcome badge, bottom-right — green ✓ success / red ✗ failure. */
  .vidwrap .vidout { position: absolute; bottom: 10px; right: 10px; z-index: 4;
    display: inline-flex; align-items: center; gap: 6px; max-width: 88%;
    font: 400 14px/1.15 var(--font-original); text-align: right;
    background: rgba(27, 27, 27, 0.7); padding: 5px 9px; border-radius: 7px;
    letter-spacing: 0; pointer-events: none; }
  .vidwrap .vidout svg { width: 13px; height: 13px; flex: 0 0 auto; display: block; }
  @media (max-width: 760px) {
    .vidwrap .vidout { bottom: 14px; right: 14px; gap: 7px; font-size: 14px; line-height: 1; padding: 6px 12px; border-radius: 8px; }
    .vidwrap .vidout svg { width: 15px; height: 15px; }
  }
  .vidwrap .vidout.ok  { color: #5fd07a; }
  .vidwrap .vidout.bad { color: #f0846a; }
  .vidwrap .vidout.mid { color: #f4d35e; }
  .vidwrap .vidout .vo-mark { font: 600 14px/1 var(--font-original); letter-spacing: -1.5px; }
  /* Poster (first frame) + video stacked; the poster covers the reload gap
     while changing γ / noise so there's no black flash. */
  .vidwrap .vidframe { position: absolute; inset: 0; border-radius: 8px; overflow: hidden; background: var(--bg); }
  .vidwrap video, .vidwrap img.poster {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 100% 50%;
    transform-origin: 56% 84%; transition: transform .25s ease; }
  /* The grasp clips (pot) draw their trajectories on a small region around
     the pear; zoom toward it so the coloured paths are legible at panel size. */
  .module[data-task="pot"] .vidwrap video, .module[data-task="pot"] .vidwrap img.poster { transform: scale(1.35); }
  .vidwrap img.poster { z-index: 1; }
  .vidwrap video { z-index: 2; opacity: 0; transition: opacity .12s ease; }
  .vidwrap.playing video { opacity: 1; }

  /* Input-noise selector: 5 buttons (1–5) shared across all panels. */
  .noise-ctl { display: flex; align-items: center; justify-content: center; gap: 12px;
    flex-wrap: wrap; margin: 2px 0 0; }
  .noise-ctl .k { font-family: var(--font-original); font-size: 14px; font-weight: 400; color: var(--sub); }
  .noise-ctl .k .m { font-weight: 600; }
  .noise-btns { display: inline-flex; gap: 6px; }
  .noise-btns button { font: 600 14px/1 var(--font-original); color: var(--sub);
    background: var(--soft); border: 1px solid var(--line); border-radius: 8px;
    width: 36px; height: 32px; cursor: pointer; transition: background .12s ease, color .12s ease, border-color .12s ease; }
  .noise-btns button:hover { border-color: var(--resid); color: var(--ink); }
  .noise-btns button.on { background: var(--resid); border-color: var(--resid); color: #fff; }

  .ctl-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .ctl-ends { display: flex; justify-content: space-between; margin-top: 4px;
    font-family: var(--font-original); font-size: 14px; color: var(--ink); }
  .ctl-label .k { font-family: var(--font-original); font-size: 14px; font-weight: 400; color: var(--sub); }
  .ctl-label .v { font-family: var(--font-original); font-size: 14px; color: var(--ink); font-weight: 600;
    display: inline-block; min-width: 2.2em; }
  /* Slider: filled track up to the thumb (--fill set by script), ink thumb
     with a cream ring, matching the flat card palette. */
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
    background: linear-gradient(to right, var(--ink) 0 var(--fill, 40%), var(--line) var(--fill, 40%) 100%);
    border-radius: 99px; outline: none; margin: 8px 0 2px; display: block; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%; background: var(--ink);
    border: 0; box-shadow: none;
    cursor: grab; transition: transform .12s ease, box-shadow .12s ease; }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); box-shadow: 0 4px 10px rgba(40,32,16,0.22); }
  input[type=range]:active::-webkit-slider-thumb { cursor: grabbing; transform: scale(1.15);
    box-shadow: 0 4px 10px rgba(40,32,16,0.22); }
  input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--ink);
    border: 0; box-shadow: none; cursor: grab; }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(19,25,32,0.18); }

  /* Trajectory-colour legend (base / ref / task / PPS). */
  .teaser-legend {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 8px 22px; margin-top: 4px;
    font-family: var(--font-original); font-size: 14px; color: var(--sub);
  }
  .teaser-legend .leg-title { color: var(--ink); font-weight: 600; }
  .teaser-legend .leg-item { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
  .teaser-legend .leg-swatch { display: inline-block; width: 26px; height: 3px; border-radius: 2px; }

  /* γ slider "Try me" hint — pill sits BELOW the bar, arrow pointing up. */
  .gamma-wrap { position: relative; margin: 22px 0 22px; }
  .gamma-hint { position:absolute; top:calc(100% + 8px); z-index:6; transform:translateX(-50%);
    display:inline-flex; align-items:center; gap:6px; padding:6px 11px 6px 9px; border-radius:999px;
    white-space:nowrap; pointer-events:none; font:600 14px/1 var(--font-original);
    background:var(--ink); color:#fff; border:0; box-shadow:0 6px 16px rgba(40,32,16,.18); opacity:0; }
  .gamma-hint .gh-cursor { width:13px; height:13px; flex:0 0 auto; color:#fff; }
  .gamma-hint::after { content:''; position:absolute; bottom:100%; left:50%; margin-left:-5px; border:5px solid transparent; border-bottom-color:var(--ink); }
  .gamma-hint.show { opacity:1; }
  @keyframes gh-bob { 0%,100%{ transform:translateX(calc(-50% - 5px)); } 50%{ transform:translateX(calc(-50% + 5px)); } }
  .gamma-hint.show.gh-bob { animation: gh-bob 1.5s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .gamma-hint.gh-bob { animation:none; } }

  html.pps-embedded, body.embed { background: transparent; }
  body.embed .wrap { padding: 0; max-width: none; }
</style>
</head>
<body data-theme="a">
  <div class="wrap">
    <div class="module" data-task="pot">
      <div class="task-tabs" id="task-tabs" role="tablist" aria-label="Task">
        <button type="button" data-dir="pot" class="on">Fruit Weighing<span class="stage">Grasp the pear</span></button>
        <button type="button" data-dir="capsule">Capsule Loading<span class="stage">Open the lid</span></button>
        <button type="button" data-dir="tea">Tea Pouring<span class="stage">Reach the teapot</span></button>
        <button type="button" data-dir="fruit">Fruit Weighing<span class="stage">Regrasp the pear</span></button>
      </div>
      <div class="vidrow">
        <div class="vidwrap" data-noise="1">
          <div class="vidframe">
          <img class="poster" src="" alt="" aria-hidden="true">
          <video muted loop playsinline preload="auto" aria-label="Rollout for input noise 1 at the current steering strength"></video>
          </div>
          <span class="vidtask">Noise 1</span>
          <span class="vidout"></span>
        </div>
        <div class="vidwrap" data-noise="0">
          <div class="vidframe">
          <img class="poster" src="" alt="" aria-hidden="true">
          <video muted loop playsinline preload="auto" aria-label="Rollout for input noise 2 at the current steering strength"></video>
          </div>
          <span class="vidtask">Noise 2</span>
          <span class="vidout"></span>
        </div>
        <div class="vidwrap" data-noise="2">
          <div class="vidframe">
          <img class="poster" src="" alt="" aria-hidden="true">
          <video muted loop playsinline preload="auto" aria-label="Rollout for input noise 3 at the current steering strength"></video>
          </div>
          <span class="vidtask">Noise 3</span>
          <span class="vidout"></span>
        </div>
        <div class="vidwrap" data-noise="3">
          <div class="vidframe">
          <img class="poster" src="" alt="" aria-hidden="true">
          <video muted loop playsinline preload="auto" aria-label="Rollout for input noise 4 at the current steering strength"></video>
          </div>
          <span class="vidtask">Noise 4</span>
          <span class="vidout"></span>
        </div>
      </div>
      <div>
        <div class="ctl-label"><span class="k">Steering strength <span class="m"><i>γ</i></span> = <span class="v" id="gval">0.4</span></span></div>
        <input id="gamma" type="range" min="0" max="1.0" step="0.01" value="0.4" />
        <div class="ctl-ends" aria-hidden="true"><span>0</span><span>1</span></div>
      </div>
      <div class="teaser-legend" aria-label="Trajectory colours">
        <span class="leg-title">Trajectories</span>
        <span class="leg-item"><span class="leg-swatch" style="background:#AF56BF"></span><span class="m"><i>&pi;</i><sub>base</sub></span></span>
        <span class="leg-item"><span class="leg-swatch" style="background:#F58A45"></span><span class="m"><i>&pi;</i><sub>ref</sub></span></span>
        <span class="leg-item"><span class="leg-swatch" style="background:#407CB6"></span><span class="m"><i>&pi;</i><sub>task</sub></span></span>
        <span class="leg-item"><span class="leg-swatch" style="background:#4f9d5d"></span><span class="m"><i>&pi;</i><sub>PPS</sub></span></span>
      </div>
    </div>
  </div>

  <script src="pps-embed.js"></script>
  <script>
    var gammaEl = document.getElementById('gamma');
    function fmt(g){ return g.toFixed(1); }

    /* Three parallel rollout sets. Each clip is keyed by input-noise sample
       (0–4, shown as buttons 1–5) and steer strength γ (0.0…1.0):
         ../steering_strength/<dir>/<noise>_<gamma>.mp4|.jpg
       The step (planning horizon) is baked in per task during encoding
       (capsule=step 2, fruit=step 1, tea=step 2). Posters cover the reload
       gap while changing γ / noise so there's no black flash. */
    var curDir = 'pot';      // selected task (tabs); each panel is one input-noise sample
    var sets = Array.prototype.map.call(document.querySelectorAll('.vidwrap[data-noise]'), function (w) {
      return { wrap: w, noise: +w.dataset.noise, poster: w.querySelector('img.poster'),
               video: w.querySelector('video'), out: w.querySelector('.vidout') };
    });

    /* Bottom-right outcome badge, keyed on the current γ index (0..10):
         capsule — γ≤0.1 can't open the lid (fail); γ≥0.2 opens (success).
         fruit   — γ≤0.4 opens the gripper to regrasp (success);
                   γ≥0.5 over-steers and fails to recover (fail).
         tea     — γ≤0.3 can't reach; γ≥0.4 approaches; per-noise collisions at
                   high γ ("collide" red / "slightly collide" yellow).
         pot     — "grasp the pear": γ≤0.1 fails; γ≥0.2 succeeds, with per-noise
                   slightly/unstable/missed-grasp overrides at various γ. */
    var ICON_OK  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>';
    var ICON_BAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    var ICON_MID = '<span class="vo-mark" aria-hidden="true">--</span>';   // partial outcome (yellow)
    // Base rule per task, resolved by γ index (first matching max wins).
    var OUTCOMES = {
      capsule: [ { max: 1,  cls: 'bad', txt: 'Opening failure' },
                 { max: 10, cls: 'ok',  txt: 'Opening success' } ],
      fruit:   [ { max: 4,  cls: 'ok',  txt: 'Open to regrasp' },
                 { max: 10, cls: 'bad', txt: 'Regrasping failure' } ],
      tea:     [ { max: 3,  cls: 'bad', txt: 'Reaching failure' },
                 { max: 10, cls: 'ok',  txt: 'Reaching success' } ],
      pot:     [ { max: 1,  cls: 'bad', txt: 'Grasping failure' },
                 { max: 10, cls: 'ok',  txt: 'Grasping success' } ]
    };
    // Per-(γ index, noise index) overrides, keyed "<idx>_<noise>" (noise 0-4 =
    // buttons 1-5). Take precedence over the base rule.
    function ov(cls, txt) { return { cls: cls, txt: txt }; }
    var SLIGHT = 'Partial opening', REGRASP = 'Regrasping failure';
    var COLLIDE = 'Collision with teapot', SLIGHT_COLLIDE = 'Slight collision';
    var GRASP_FAIL = 'Grasping failure', GRASP_OK = 'Grasping success', GRASP_SLIGHT = 'Partial grasp',
        GRASP_UNSTABLE = 'Unstable grasp', GRASP_MISS = 'Missed grasp';
    var OVERRIDES = {
      capsule: { '1_1': ov('mid', SLIGHT), '1_2': ov('mid', SLIGHT),
                 '2_0': ov('mid', SLIGHT), '2_1': ov('mid', SLIGHT), '2_3': ov('mid', SLIGHT), '2_4': ov('mid', SLIGHT),
                 '3_4': ov('mid', SLIGHT) },
      fruit:   { '2_0': ov('bad', REGRASP), '3_0': ov('bad', REGRASP), '3_3': ov('bad', REGRASP),
                 '4_0': ov('bad', REGRASP), '4_2': ov('bad', REGRASP), '4_3': ov('bad', REGRASP) },
      tea:     { '8_1': ov('mid', SLIGHT_COLLIDE),
                 '9_1': ov('bad', COLLIDE), '9_3': ov('mid', SLIGHT_COLLIDE), '9_4': ov('bad', COLLIDE),
                 '10_1': ov('bad', COLLIDE), '10_3': ov('bad', COLLIDE), '10_4': ov('bad', COLLIDE) },
      pot:     { '2_0': ov('bad', GRASP_FAIL), '2_2': ov('bad', GRASP_FAIL), '2_3': ov('bad', GRASP_FAIL),
                 '3_2': ov('mid', GRASP_SLIGHT), '3_1': ov('mid', GRASP_SLIGHT),
                 '4_1': ov('mid', GRASP_SLIGHT),
                 '7_3': ov('mid', GRASP_SLIGHT), '7_1': ov('mid', GRASP_SLIGHT),
                 '8_2': ov('mid', GRASP_UNSTABLE), '8_1': ov('mid', GRASP_UNSTABLE),
                 '9_2': ov('mid', GRASP_UNSTABLE), '9_1': ov('bad', GRASP_MISS),
                 '10_2': ov('mid', GRASP_UNSTABLE), '10_3': ov('mid', GRASP_SLIGHT), '10_1': ov('bad', GRASP_MISS) }
    };
    function updateOutcome(s, idx) {
      if (!s.out) return;
      var noise = s.noise;
      var o = (OVERRIDES[curDir] && OVERRIDES[curDir][idx + '_' + noise]) || null;
      if (!o) {
        var rules = OUTCOMES[curDir] || [];
        for (var i = 0; i < rules.length; i++) { if (idx <= rules[i].max) { o = rules[i]; break; } }
      }
      if (!o) return;
      s.out.className = 'vidout ' + o.cls;
      var mark = o.cls === 'ok' ? ICON_OK : (o.cls === 'bad' ? ICON_BAD : ICON_MID);
      s.out.innerHTML = mark + '<span>' + o.txt + '</span>';
    }

    var curIdx = 4;          // γ index (γ=0.4)
    var idleTimer = null;
    function labelFor(idx) { return (idx === 10) ? '1.0' : ('0.' + idx); }
    function clipBase(noise) { return '../steering_strength/' + curDir + '/' + noise + '_' + labelFor(curIdx); }
    function vsrc(noise) { return clipBase(noise) + '.mp4'; }
    function psrc(noise) { return clipBase(noise) + '.jpg'; }
    function setMatchesCur(s) { return s.video.src.indexOf('/' + curDir + '/' + s.noise + '_' + labelFor(curIdx) + '.mp4') !== -1; }

    // Load (if needed) and play one panel's rollout for the current γ + noise.
    // With autoplay removed, a freshly-swapped src must finish loading before we
    // can play it — calling play() mid-load aborts it, so defer to 'canplay'.
    function playSet(s) {
      if (setMatchesCur(s)) {
        var pr = s.video.play();
        if (pr && pr.catch) pr.catch(function () {});
        return;
      }
      s.video.src = vsrc(s.noise);
      s.video.addEventListener('canplay', function () {
        if (!setMatchesCur(s)) return;   // changed again; a later playAll covers it
        var pr = s.video.play();
        if (pr && pr.catch) pr.catch(function () {});
      }, { once: true });
      s.video.load();
    }
    function playAll() { sets.forEach(playSet); }

    // Swap every panel's poster to the current (noise, γ), hide the stale video,
    // and (debounced) auto-play once the controls have been idle `delay` ms.
    function applyState(delay) {
      sets.forEach(function (s) { s.poster.src = psrc(s.noise); s.wrap.classList.remove('playing'); });
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(playAll, delay);
    }

    // Reveal each panel's video (fade over poster) once it's playing + current.
    sets.forEach(function (s) {
      s.video.addEventListener('playing', function () { if (setMatchesCur(s)) s.wrap.classList.add('playing'); });
      s.video.addEventListener('loadeddata', function () { if (!s.video.paused && setMatchesCur(s)) s.wrap.classList.add('playing'); });
    });

    // Preload one noise row (all γ, all panels) so dragging swaps instantly.
    function preloadTask(dir) {
      sets.forEach(function (s) {
        for (var i = 0; i <= 10; i++) { var im = new Image(); im.src = '../steering_strength/' + dir + '/' + s.noise + '_' + labelFor(i) + '.jpg'; }
      });
    }
    preloadTask(curDir);
    sets.forEach(function (s) { s.poster.src = psrc(s.noise); s.video.src = vsrc(s.noise); updateOutcome(s, curIdx); });

    // Autoplay removed: hold on the poster and start the first playback 2 s
    // after load if the controls are left alone. Any change reschedules this.
    idleTimer = setTimeout(playAll, 2000);

    // γ slider: update readout always; on an index change swap clips + outcome
    // and (re)arm the 2 s idle play.
    function paintFill() {
      var lo = parseFloat(gammaEl.min), hi = parseFloat(gammaEl.max), v = parseFloat(gammaEl.value);
      gammaEl.style.setProperty('--fill', (100 * (v - lo) / (hi - lo)).toFixed(2) + '%');
    }
    paintFill();
    gammaEl.addEventListener('input', function () {
      var g = parseFloat(this.value);
      paintFill();
      var idx = Math.round(g * 10); if (idx < 0) idx = 0; else if (idx > 10) idx = 10;
      document.getElementById('gval').textContent = fmt(g);
      if (idx === curIdx) return;
      curIdx = idx;
      sets.forEach(function (s) { updateOutcome(s, idx); });
      applyState(2000);
    });

    // Task tabs: switch which task's 4 input-noise rollouts are shown.
    var taskBtns = Array.prototype.slice.call(document.querySelectorAll('#task-tabs button'));
    taskBtns.forEach(function (b) {
      b.addEventListener('click', function () {
        var d = b.dataset.dir;
        if (d === curDir) return;
        curDir = d;
        var mod = document.querySelector('.module'); if (mod) mod.setAttribute('data-task', curDir);
        taskBtns.forEach(function (x) { x.classList.toggle('on', x.dataset.dir === curDir); });
        sets.forEach(function (s) { updateOutcome(s, curIdx); });
        preloadTask(curDir);
        applyState(700);
      });
    });

    /* γ slider "Try me" hint: bobbing pill on the thumb + one auto-jitter that
       sweeps the 0.1–0.5 range before settling back to the default. */
    (function () {
      var wrap = document.createElement('div'); wrap.className = 'gamma-wrap';
      gammaEl.parentNode.insertBefore(wrap, gammaEl); wrap.appendChild(gammaEl);
      var pill = document.createElement('div'); pill.className = 'gamma-hint';

    })();
  </script>
